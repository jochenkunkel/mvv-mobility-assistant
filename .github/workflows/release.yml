name: Signed Android Release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 0.2.0'
        required: true
        default: '0.2.0'
# New runs in any workflow cancel older runs, including signed releases.
concurrency:
  group: single-active-ci
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MEIN_WEG_KEYSTORE_PASSWORD: ${{ secrets.MEIN_WEG_KEYSTORE_PASSWORD }}
      MEIN_WEG_KEY_ALIAS: ${{ secrets.MEIN_WEG_KEY_ALIAS }}
      MEIN_WEG_KEY_PASSWORD: ${{ secrets.MEIN_WEG_KEY_PASSWORD }}
      MEIN_WEG_KEYSTORE_BASE64: ${{ secrets.MEIN_WEG_KEYSTORE_BASE64 }}
      MEIN_WEG_KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify persistent signing secrets
        shell: bash
        run: |
          test -n "$MEIN_WEG_KEYSTORE_BASE64" || { echo "::error::Missing persistent release keystore secret"; exit 1; }
          test -n "$MEIN_WEG_KEYSTORE_PASSWORD" && test -n "$MEIN_WEG_KEY_ALIAS" && test -n "$MEIN_WEG_KEY_PASSWORD" || { echo "::error::Missing release signing secrets"; exit 1; }
          printf '%s' "$MEIN_WEG_KEYSTORE_BASE64" | base64 --decode > "$MEIN_WEG_KEYSTORE_PATH"
          chmod 600 "$MEIN_WEG_KEYSTORE_PATH"
      - name: Build signed APK and AAB
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:bundleRelease -PmeinWegVersionCode=${{ github.run_number }} -PmeinWegVersionName=${{ inputs.version_name }}
      - name: Check APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release packages
        uses: actions/upload-artifact@v4
        with:
          name: mein-weg-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Delete local keystore
        if: always()
        run: rm -f "$MEIN_WEG_KEYSTORE_PATH"
