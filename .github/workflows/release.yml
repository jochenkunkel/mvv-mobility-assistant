name: Signed Android Release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 0.2.0'
        required: true
        default: '0.2.0'
# Never cancel a manual signed release. Use an event/ref scoped group like the
# Android workflow instead of the obsolete global cancellation group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
jobs:
  # A signed release is only allowed when the complete Android release gate
  # succeeded for the exact commit that is about to be signed.
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Android release acceptance for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "release-acceptance" and .status == "completed" and .conclusion == "success")] | length')
          if [[ "$result" == "0" ]]; then
            echo "::error::No successful release-acceptance check for ${SHA}. Run Android CI with test_level=release on this commit first."
            exit 1
          fi
          echo "Release gate confirmed for ${SHA} ($result successful check run)."

  signed-release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Reuse the existing stable CI signing secrets. The build script consumes
    # MEIN_WEG_KEYSTORE_* env names; they are fed from the configured secrets.
    env:
      MEIN_WEG_KEYSTORE_PASSWORD: ${{ secrets.MEIN_WEG_CI_SIGNING_STORE_PASSWORD }}
      MEIN_WEG_KEY_ALIAS: ${{ secrets.MEIN_WEG_CI_SIGNING_KEY_ALIAS }}
      MEIN_WEG_KEY_PASSWORD: ${{ secrets.MEIN_WEG_CI_SIGNING_KEY_PASSWORD }}
      MEIN_WEG_KEYSTORE_BASE64: ${{ secrets.MEIN_WEG_CI_SIGNING_KEY_B64 }}
      MEIN_WEG_KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify persistent signing secrets
        shell: bash
        run: |
          test -n "$MEIN_WEG_KEYSTORE_BASE64" || { echo "::error::Missing stable CI signing key (MEIN_WEG_CI_SIGNING_KEY_B64)"; exit 1; }
          test -n "$MEIN_WEG_KEYSTORE_PASSWORD" && test -n "$MEIN_WEG_KEY_ALIAS" && test -n "$MEIN_WEG_KEY_PASSWORD" || { echo "::error::Missing stable CI signing secrets"; exit 1; }
          printf '%s' "$MEIN_WEG_KEYSTORE_BASE64" | base64 --decode > "$MEIN_WEG_KEYSTORE_PATH"
          chmod 600 "$MEIN_WEG_KEYSTORE_PATH"
      - name: Build signed APK and AAB
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:bundleRelease -PmeinWegVersionCode=${{ github.run_number }} -PmeinWegVersionName=${{ inputs.version_name }}
      - name: Check APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release packages
        uses: actions/upload-artifact@v4
        with:
          name: mein-weg-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Delete local keystore
        if: always()
        run: rm -f "$MEIN_WEG_KEYSTORE_PATH"
