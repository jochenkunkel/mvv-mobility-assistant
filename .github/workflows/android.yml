name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mvv-live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe real MVV EFA response schema
        run: python3 scripts/mvv-live-probe.py

  door-to-door-live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify coordinate destination trip routing
        run: python3 scripts/mvv-door-to-door-probe.py

  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell and embedded Python before any build
        run: bash scripts/preflight.sh

  build-and-test:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mein-weg-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  emulator-smoke-test:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build app and instrumentation tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android emulator and run UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p test-results/ui-screenshots
            # Instrumentation may uninstall the target app and delete its external files.
            # Reinstall and capture the *actual rendered* UI before uploading artifacts.
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n de.mvv.mobility/.MainActivity --ez mein_weg_test_fixture true
            sleep 4
            adb exec-out screencap -p > test-results/ui-screenshots/01-start-real.png
            adb shell input swipe 500 1400 500 450 450
            sleep 2
            adb exec-out screencap -p > test-results/ui-screenshots/02-start-scrolled-real.png
            test -s test-results/ui-screenshots/01-start-real.png
            test -s test-results/ui-screenshots/02-start-scrolled-real.png
      - name: Upload emulator logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-results
          path: |
            test-results/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
