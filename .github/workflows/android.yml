name: Android CI
on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Testumfang: fast für Zwischenstände, release für alle Tests'
        type: choice
        required: true
        default: fast
        options:
          - fast
          - release
# Keep only the newest run per branch/PR. Tags and manual release
# validations have separate groups and are not cancelled by normal pushes.
concurrency:
  group: android-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.ref) || startsWith(github.ref, 'refs/tags/') && format('tag-{0}', github.ref) || format('branch-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
jobs:
  mvv-live-probe:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_level == 'release') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe real MVV EFA response schema
        run: python3 scripts/mvv-live-probe.py

  door-to-door-live-probe:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_level == 'release') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify coordinate destination trip routing
        run: python3 scripts/mvv-door-to-door-probe.py

  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell and embedded Python before any build
        run: |
          bash scripts/preflight.sh
          python3 scripts/test-emulator-navigation.py

  build-and-test:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests and debug APK (every commit)
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Android lint (release validation)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_level == 'release') || startsWith(github.ref, 'refs/tags/v') }}
        run: gradle --no-daemon :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mein-weg-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  emulator-smoke-test:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_level == 'release') || startsWith(github.ref, 'refs/tags/v') }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build app and instrumentation tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android emulator and run UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p test-results/ui-screenshots
            # Instrumentation may uninstall the target app and delete its external files.
            # Reinstall and capture the *actual rendered* UI before uploading artifacts.
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell input keyevent KEYCODE_HOME || true
            adb shell am start -W -n de.mvv.mobility/.MainActivity --ez mein_weg_test_fixture true --ez mein_weg_visual_fixture true
            sleep 5
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml test-results/ui-screenshots/window-start.xml >/dev/null
            ! grep -Eiq 'isn.t responding|is not responding|App isn.t responding|Close app' test-results/ui-screenshots/window-start.xml || (echo 'System error dialog obscures app; screenshots invalid' && exit 1)
            adb exec-out screencap -p > test-results/ui-screenshots/01-start-real.png
            # Capture each tab of the actual rendered cockpit on Pixel 6 emulator.
            python3 scripts/tap-emulator-navigation.py Verbindungen
            sleep 3
            adb exec-out screencap -p > test-results/ui-screenshots/02-verbindungen-real.png
            python3 scripts/tap-emulator-navigation.py 'Meine Fahrt'
            sleep 3
            adb exec-out screencap -p > test-results/ui-screenshots/03-meine-fahrt-real.png
            python3 -c 'import hashlib; from pathlib import Path; p=Path("test-results/ui-screenshots"); files=[p/n for n in ("01-start-real.png","02-verbindungen-real.png","03-meine-fahrt-real.png")]; assert all(f.stat().st_size>10000 for f in files), "Screenshot missing"; assert len({hashlib.sha256(f.read_bytes()).digest() for f in files})==3, "Cockpit tabs did not produce three distinct screenshots"; print("Three cockpit screenshots validated")'
            # Device-class layout smoke captures. S25 is an approximate viewport, NOT real Samsung/One UI.
            adb shell wm size 1080x2340
            adb shell wm density 420
            adb shell am force-stop de.mvv.mobility
            adb shell am start -W -n de.mvv.mobility/.MainActivity --ez mein_weg_test_fixture true --ez mein_weg_visual_fixture true
            sleep 3
            adb exec-out screencap -p > test-results/ui-screenshots/04-galaxy-s25-viewport-approx.png
            adb shell wm size 720x1600
            adb shell wm density 320
            adb shell am force-stop de.mvv.mobility
            adb shell am start -W -n de.mvv.mobility/.MainActivity --ez mein_weg_test_fixture true --ez mein_weg_visual_fixture true
            sleep 3
            adb exec-out screencap -p > test-results/ui-screenshots/05-compact-360dp-viewport.png
            adb shell wm size reset
            adb shell wm density reset
            python3 -c 'from pathlib import Path; p=Path("test-results/ui-screenshots"); assert all((p/n).stat().st_size>10000 for n in ("04-galaxy-s25-viewport-approx.png","05-compact-360dp-viewport.png")); print("Additional viewport captures saved for manual visual inspection")'
      - name: Upload emulator logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-results
          path: |
            test-results/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
